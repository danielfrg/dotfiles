add_newline = true
command_timeout = 200
format = "$hostname${env_var.rex}[$directory$git_branch$git_status]($style)$character"

[hostname]
ssh_only = true
format = "[host: $hostname](bold yellow) "
disabled = false

[env_var.rex]
variable = "REX_REMOTE_HOST"
format = "[rex: $env_value](bold yellow) "

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style      = "cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
