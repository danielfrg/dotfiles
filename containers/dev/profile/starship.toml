add_newline = true
command_timeout = 200
format = "$hostname[$directory$git_branch$git_status]($style)$character"

[hostname]
ssh_only = false
format = "[$hostname](bold yellow) "

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
format = "[$branch]($style) "
style = "cyan"

[git_status]
format = "[$all_status]($style)"
style = "cyan"
